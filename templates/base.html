<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Football Talent Discovery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet" />

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Custom CSS -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
  </head>

  <body>
    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid px-5">
        <a class="navbar-brand" href="{{ url_for('home') }}">
          <i class="bi bi-dribbble me-2"></i>
          Football Talent Discovery
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                href="{{ url_for('home') }}">
                <i class="bi bi-house-door me-1"></i>
                Home
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'recommendation' %}active{% endif %}"
                href="{{ url_for('recommendation') }}">
                <i class="bi bi-stars me-1"></i>
                Recommendation
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'clustering' %}active{% endif %}"
                href="{{ url_for('clustering') }}">
                <i class="bi bi-diagram-3 me-1"></i>
                Player Clustering
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'hidden_gem' %}active{% endif %}"
                href="{{ url_for('hidden_gem') }}">
                <i class="bi bi-gem me-1"></i>
                Hidden Gems
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'scout_ai' %}active{% endif %}"
                href="{{ url_for('scout_ai') }}">
                <i class="bi bi-robot me-1"></i>

                Scout AI
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'saved_players' %}active{% endif %}"
                href="{{ url_for('saved_players') }}">
                <i class="bi bi-bookmark-heart me-1"></i>

                Saved Players
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Content -->

    <div class="container mt-4 page-content">
      {% block content %} {% endblock %}
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page Specific JavaScript -->

    {% block scripts %} {% endblock %}
  </body>
</html>

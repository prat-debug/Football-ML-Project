{% extends "base.html" %} {% block content %}

<h2 class="mb-4">Player Recommendation</h2>

<div class="card shadow">
  <div class="card-body">
    <form id="recommendationForm">
      <!-- Player Name -->

      <div class="mb-3">
        <label class="form-label"> Player Name </label>

        <input
          type="text"
          class="form-control"
          id="player_name"
          placeholder="Enter player name"
          required />
      </div>

      <!-- Recommendation Method -->

      <div class="mb-3">
        <label class="form-label"> Recommendation Method </label>

        <select class="form-select" id="method">
          <option value="knn">KNN</option>

          <option value="cosine">Cosine Similarity</option>
        </select>
      </div>

      <!-- Number of Recommendations -->

      <div class="mb-3">
        <label class="form-label"> Number of Recommendations </label>

        <input
          type="number"
          class="form-control"
          id="top_n"
          value="10"
          min="1"
          max="25" />
      </div>

      <button type="submit" class="btn btn-primary">Recommend Players</button>
    </form>
  </div>
</div>

<!-- Error Message -->

<div
  id="errorMessage"
  class="alert alert-danger mt-4"
  style="display: none"></div>

<!-- Results -->

<div id="resultsSection" class="mt-5" style="display: none">
  <h3>Similar Players</h3>

  <table class="table table-striped table-bordered">
    <thead>
      <tr id="tableHeader"></tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>
</div>

{% endblock %} {% block scripts %}

<script src="{{ url_for('static', filename='js/recommendation.js') }}"></script>

{% endblock %}
